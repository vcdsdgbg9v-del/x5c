<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X5C</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: #1c1c1c;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        input,
        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border-radius: 10px;
            border: 0;
            font-size: 16px;
        }

        input {
            background: #292929;
            color: white;
            outline: none;
        }

        button {
            background: #fff;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(.98);
        }

        #result {
            margin-top: 20px;
            background: #101010;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
            word-break: break-word;
            direction: ltr;
            text-align: left;
            min-height: 60px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>X5C</h1>

    <input
        id="username"
        type="text"
        placeholder="اسم المستخدم"
        autocomplete="off"
    >

    <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="off"
    >

    <button onclick="login()">تسجيل الدخول</button>
    <button onclick="getPlayer()">جلب بيانات اللاعب</button>
    <button onclick="getCar()">جلب بيانات السيارة</button>

    <div id="result">النتيجة ستظهر هنا...</div>

</div>

<script>

let token = '';

function show(data) {
    document.getElementById('result').textContent =
        typeof data === 'string'
            ? data
            : JSON.stringify(data, null, 2);
}

async function post(action, data) {

    const form = new URLSearchParams();

    for (const key in data) {
        form.append(key, data[key]);
    }

    const response = await fetch(
        'api.php?action=' + encodeURIComponent(action),
        {
            method: 'POST',
            headers: {
                'Content-Type':
                    'application/x-www-form-urlencoded'
            },
            body: form.toString()
        }
    );

    return await response.json();
}

async function login() {

    const username =
        document.getElementById('username').value.trim();

    const password =
        document.getElementById('password').value;

    if (!username || !password) {
        show('أدخل اسم المستخدم وكلمة المرور.');
        return;
    }

    show('جاري تسجيل الدخول...');

    try {

        const result = await post('login', {
            username: username,
            password: password
        });

        /*
         * إذا كان الـ API يعيد token داخل data،
         * يتم حفظه تلقائياً.
         */
        if (
            result &&
            result.data &&
            result.data.token
        ) {
            token = result.data.token;
        }

        show(result);

    } catch (error) {
        show({
            success: false,
            error: error.message
        });
    }
}

async function getPlayer() {

    if (!token) {
        show('سجّل الدخول أولاً.');
        return;
    }

    show('جاري جلب بيانات اللاعب...');

    try {

        const result = await post('player', {
            token: token
        });

        show(result);

    } catch (error) {
        show({
            success: false,
            error: error.message
        });
    }
}

async function getCar() {

    if (!token) {
        show('سجّل الدخول أولاً.');
        return;
    }

    show('جاري جلب بيانات السيارة...');

    try {

        const result = await post('car', {
            token: token
        });

        show(result);

    } catch (error) {
        show({
            success: false,
            error: error.message
        });
    }
}

</script>

</body>
</html>
